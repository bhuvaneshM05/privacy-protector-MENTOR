# Configuration for MENTOR Experiments
dataset:
  num_users: 300
  num_items: 200
  density: 0.1
  domain: [1.0, 5.0]
  seed: 42

experiment:
  epsilons: [0.1, 0.3, 0.5, 0.7, 1.0]
  test_ratio: 0.2
  relevance_threshold: 4.0

model:
  latent_dim: 15
  lambda_reg: 0.001
  learning_rate: 0.001
  num_components: 5
  alpha: 0.5
  em_threshold: 0.0001
  max_em_epochs: 10
  sgd_inner_epochs: 3
